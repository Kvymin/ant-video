<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LogVar 弹幕服务 (Node)</title>
  <style>
    :root { color-scheme: dark light; }
    body {
      margin: 0;
      padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
      background: #101216;
      color: #e8eaed;
      font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: #8b93a1; font-size: 13px; margin-bottom: 20px; }
    .card {
      background: #181b21;
      border: 1px solid #252932;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .card h2 { font-size: 14px; margin: 0 0 8px; color: #cfd4dc; }
    code {
      background: #22262e;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      color: #9ecbff;
    }
    ol { margin: 0; padding-left: 20px; }
    li { margin-bottom: 6px; }
  </style>
</head>
<body>
  <h1>LogVar 弹幕服务 · Node 版</h1>
  <div class="sub">探针版本，前端页面是占位的</div>

  <div class="card">
    <h2>这个包在做什么</h2>
    <p>弹幕服务本体跑在宿主的内嵌 node 里（worker_threads），不在本页面里。
      所以这一页没有任何状态可看，配置也改不了——配置写在包内的
      <code>server/index.config.js</code>。</p>
  </div>

  <div class="card">
    <h2>怎么用</h2>
    <ol>
      <li>播放器 → 弹幕设置 → 弹幕 API 填 <code>miniapp://com.logvar.danmu.node</code></li>
      <li>播放时会自动把服务拉起来，不需要手动打开这个页面</li>
      <li>要手动看状态：小程序详情页 → 「Node 服务」区块</li>
    </ol>
  </div>
</body>
</html>
